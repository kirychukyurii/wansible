---
# Must run before any role reading webitel_*/ha_mode/consul_pki_enabled;
# imported first in every domain playbook for standalone runs.
- name: Resolve cluster topology facts
  hosts: all
  gather_facts: false
  any_errors_fatal: "{{ fail_fast | default(true) }}"
  tags: [always]
  pre_tasks:
    - name: Gather facts if not already present
      ansible.builtin.setup:
      when: ansible_facts.default_ipv4 is not defined
  roles:
    - topology
