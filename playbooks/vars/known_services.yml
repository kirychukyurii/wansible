---
# Every value a host may put in its `services` list. Preflight rejects anything
# not listed here, and the constructed inventory plugin turns each name into an
# Ansible group.
webitel_known_services:
  - consul_server
  - consul_agent
  - nomad_server
  - nomad_client
  - patroni
  - postgres
  - rabbitmq
  - haproxy
  - freeswitch
  - rtpengine
  - opensips
  - nginx
  - grafana
  - webitel_core
  - webitel_engine
  - webitel_call_center
  - webitel_flow_manager
  - webitel_storage
  - webitel_messages
  - webitel_logger
  - webitel_cases
  - webitel_media_exporter
  - webitel_frontend
