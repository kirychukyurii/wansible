---
# Thin wrapper around roles/topology/tasks/validate.yml, kept as a playbook so
# an inventory can be checked on its own:
#   ansible-playbook -i inventories/<name> playbooks/validate_topology.yml
# The checks read inventory data only, so this needs no SSH and no managed
# hosts. tests/run.sh drives it against the fixtures in tests/fixtures/.
- name: Validate topology
  hosts: localhost
  gather_facts: false
  any_errors_fatal: "{{ fail_fast | default(true) }}"
  tags: [always]
  tasks:
    - name: Topology | Validate the inventory against the declared profile
      ansible.builtin.include_role:
        name: topology
        tasks_from: validate
