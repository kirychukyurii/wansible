[defaults]
inventory = inventories/singlehost.example
roles_path = roles
interpreter_python = auto_silent
forks = 10
timeout = 30
host_key_checking = False
retry_files_enabled = False
local_tmp = .ansible/tmp
# Fact caching: факти збираються раз і кешуються, тож --limit-прогони можуть
# посилатись на ansible_default_ipv4 хостів поза лімітом (topology рахує
# адреси залежностей крос-хост). gathering=smart → не збирає повторно, якщо
# факти вже в кеші.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible/facts
fact_caching_timeout = 7200

[inventory]
enable_plugins = host_list, auto, yaml, ini, toml, ansible.builtin.constructed

[ssh_connection]
pipelining = True
# Повторити SSH-конект N разів перед тим, як оголосити хост UNREACHABLE
# (рятує від мерехтливої недоступності / тимчасових мережевих збоїв).
retries = 3
