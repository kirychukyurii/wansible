---
webitel_call_center_package: webitel-call-center
webitel_call_center_unit: webitel-call-center

# Verify against `dpkg -L webitel-call-center | grep /etc/default/` after install.
webitel_call_center_env_file: /etc/default/call_center

_webitel_call_center_host_addr: "{{ '127.0.0.1' if single_node | default(false) else ansible_facts.default_ipv4.address }}"

webitel_call_center_env_defaults:
  CONSUL: "{{ webitel_consul_address }}:8500"
  AMQP: "{{ webitel_amqp_url }}?heartbeat=10"
  DATA_SOURCE: "{{ webitel_pg_dsn_base }}?application_name=call_center&sslmode=disable&connect_timeout=10&search_path=call_center"
  SQL_DATA_SOURCE_REPLICAS: "{{ webitel_pg_dsn_replicas }}?application_name=call_center&sslmode=disable&connect_timeout=10&search_path=call_center"
  GRPC_ADDR: "{{ _webitel_call_center_host_addr }}"
# Merged over _env_defaults, taking precedence.
webitel_call_center_env_extra: {}
