---
- name: Restart grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
    daemon_reload: true
  # Skip on standby: grafana would fail to start against a read-only PG.
  when: grafana_active | bool
  listen: restart grafana

- name: Set privileges on provisioned dashboards files
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    recurse: true
    owner: grafana
    group: grafana
    mode: "0640"
  listen: provisioned dashboards changed

- name: Set privileges on provisioned dashboards directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    recurse: false
    mode: "0755"
  listen: provisioned dashboards changed
