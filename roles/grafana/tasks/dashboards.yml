---
- name: Deploy dashboard provisioning config
  ansible.builtin.copy:
    dest: /etc/grafana/provisioning/dashboards/ansible.yml
    content: |
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          allowUiUpdates: true
          options:
            path: "/var/lib/grafana/dashboards"
    owner: root
    group: grafana
    mode: "0640"
  notify: restart grafana

- name: Import grafana dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /var/lib/grafana/dashboards/{{ item | basename }}
    owner: grafana
    group: grafana
    mode: "0640"
  with_fileglob:
    - "{{ grafana_basic_dashboards_language }}/*.json"
  notify: provisioned dashboards changed

- name: Find deployed dashboard JSON files
  ansible.builtin.find:
    paths: /var/lib/grafana/dashboards
    patterns: "*.json"
  register: grafana_dashboards_list_files

- name: Set the correct data source name in dashboards
  ansible.builtin.replace:
    path: /var/lib/grafana/dashboards/{{ item.path | basename }}
    regexp: '"(?:\${)?DS_[A-Z0-9_-]+(?:})?"'
    replace: '"PostgreSQL"'
  changed_when: false
  loop: "{{ grafana_dashboards_list_files.files }}"
