---
- name: Download OpenSIPS config (first run only)
  ansible.builtin.get_url:
    url: "{{ opensips_config_url }}"
    dest: /etc/opensips/opensips.cfg
    force: false
    mode: "0644"
  notify: restart opensips

- name: Set MI listen address in opensips.cfg (multi-node)
  ansible.builtin.replace:
    path: /etc/opensips/opensips.cfg
    regexp: '(^.*"httpd".*)\s"127\.0\.0\.1"(.*$)'
    replace: '\1 "{{ ansible_facts.default_ipv4.address }}"\2'
  when: not single_node | default(false)
  notify: restart opensips

# No single_node guard needed: webitel_pg_* already resolves to 127.0.0.1 there.
- name: Set PostgreSQL DSN (user, password, host, port) in opensips.cfg
  ansible.builtin.replace:
    path: /etc/opensips/opensips.cfg
    regexp: 'postgres://[^:@"]+:[^@"]+@[^:/"]+:\d+'
    replace: "postgres://{{ webitel_pg_user }}:{{ webitel_pg_password }}@{{ webitel_pg_host }}:{{ webitel_pg_port }}"
  notify: restart opensips

- name: Set RTPEngine address in opensips.cfg (multi-node)
  ansible.builtin.replace:
    path: /etc/opensips/opensips.cfg
    regexp: '(^.*)\s"udp:127\.0\.0\.1:60000"(.*$)'
    replace: '\1 "udp:{{ hostvars[groups["rtpengine"][0]].ansible_default_ipv4.address }}:60000"\2'
  when:
    - not single_node | default(false)
    - groups['rtpengine'] | default([]) | length > 0
  notify: restart opensips

# Optional :port is captured and overwritten, else a re-run appends @host:new:old.
- name: Set RabbitMQ connection (user, password, host, port) in opensips.cfg
  ansible.builtin.replace:
    path: /etc/opensips/opensips.cfg
    regexp: 'rabbitmq:[^:@"]+:[^@"]+@[^"/:\s]+(:\d+)?'
    replace: "rabbitmq:{{ webitel_amqp_user }}:{{ webitel_amqp_password }}@{{ webitel_amqp_host }}:{{ webitel_amqp_port }}"
  notify: restart opensips

- name: Enable and start opensips
  ansible.builtin.systemd_service:
    name: opensips
    enabled: true
    state: started
    daemon_reload: true
