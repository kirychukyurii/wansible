---
base_packages:
  - acl
  - curl
  - wget
  - unzip
  - gnupg
  - locales
  - dnsutils
  - python3-psycopg2
  - python3-debian
  - cron
base_locales: "{{ locales_gen }}"
base_sysctl:
  net.ipv6.conf.all.disable_ipv6: "1"
  net.ipv6.conf.default.disable_ipv6: "1"
  net.ipv6.conf.lo.disable_ipv6: "1"
  fs.file-max: "1000000"
  vm.max_map_count: "262144"
base_repo_keyring: /usr/share/keyrings/webitel-apt-repo.gpg
