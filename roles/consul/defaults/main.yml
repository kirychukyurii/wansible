---
consul_role: server
consul_datacenter: "{{ datacenter }}"
consul_log_level: INFO            # trace|debug|info|warn|err
consul_ui: false
consul_telemetry_retention: "1m"  # prometheus_retention_time
consul_server_hosts: >-
  {{ groups['consul_server'] | default([])
     | map('extract', hostvars)
     | selectattr('datacenter', 'defined')
     | selectattr('datacenter', '==', consul_datacenter)
     | map(attribute='inventory_hostname') | list
     or groups['consul_server'] | default([]) }}
consul_bind_address: >-
  {{ '127.0.0.1' if single_node | default(false)
     else ansible_facts.default_ipv4.address }}
# client_addr takes a space-separated list; loopback for local consumers, private IP for peers.
consul_client_address: >-
  {{ '127.0.0.1' if single_node | default(false)
     else '127.0.0.1 ' + ansible_facts.default_ipv4.address }}
consul_data_dir: /var/consul
consul_config_dir: /etc/consul.d
consul_keyring: /usr/share/keyrings/hashicorp-archive-keyring.gpg

# 16-byte base64, generate with `consul keygen`
consul_encrypt_key: "{{ vault_consul_encrypt_key | default('') }}"
consul_tls_enabled: "{{ consul_pki_enabled | default(false) }}"
consul_ca_file: "{{ pki_remote_dir }}/ca.pem"
consul_cert_file: "{{ pki_remote_dir }}/{{ inventory_hostname }}.pem"
consul_key_file: "{{ pki_remote_dir }}/{{ inventory_hostname }}-key.pem"
consul_dns_forward: "{{ not single_node | default(false) }}"
dns_upstream_servers: []
