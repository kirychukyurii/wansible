---
webitel_service_spec:
  package: webitel-call-center
  units: [webitel-call-center]
  env_files:
    - path: /etc/default/webitel-call-center
      env:
        CONSUL: "{{ webitel_consul_address }}:8500"
        AMQP: "{{ webitel_amqp_url }}?heartbeat={{ webitel_call_center_amqp_heartbeat | default(webitel_amqp_heartbeat) }}"
        DATA_SOURCE: "{{ webitel_pg_dsn_base }}?application_name=call_center\
          &sslmode={{ webitel_call_center_pg_sslmode | default(webitel_pg_sslmode) }}\
          &connect_timeout={{ webitel_call_center_pg_connect_timeout | default(webitel_pg_connect_timeout) }}\
          &search_path=call_center"
        SQL_DATA_SOURCE_REPLICAS: "{{ webitel_pg_dsn_replicas }}?application_name=call_center\
          &sslmode={{ webitel_call_center_pg_sslmode | default(webitel_pg_sslmode) }}\
          &connect_timeout={{ webitel_call_center_pg_connect_timeout | default(webitel_pg_connect_timeout) }}\
          &search_path=call_center"
        GRPC_ADDR: "{{ '127.0.0.1' if single_node | default(false) else ansible_facts.default_ipv4.address }}"
        GRPC_PORT: "{{ webitel_call_center_grpc_port }}"
        ENABLE_OMNICHANNEL: "{{ webitel_call_center_omnichannel | default(0) }}"
        LOG_LVL: "{{ webitel_call_center_log_level | default(webitel_log_level | default('debug')) }}"
