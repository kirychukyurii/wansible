---
webitel_service_spec:
  package: webitel-logger
  units: [webitel-logger]
  env_files:
    - path: /etc/default/webitel-logger
      env:
        CONSUL: "{{ webitel_consul_address }}:8500"
        BROKER_ADDRESS: "{{ webitel_amqp_url }}?heartbeat={{ webitel_logger_amqp_heartbeat | default(webitel_amqp_heartbeat) }}"
        DATASOURCE: "{{ webitel_pg_dsn_base }}?application_name=logger\
          &sslmode={{ webitel_logger_pg_sslmode | default(webitel_pg_sslmode) }}\
          &connect_timeout={{ webitel_logger_pg_connect_timeout | default(webitel_pg_connect_timeout) }}"
        GRPC_ADDR: "{{ '127.0.0.1' if single_node | default(false) else ansible_facts.default_ipv4.address }}:{{ webitel_logger_grpc_port }}"
