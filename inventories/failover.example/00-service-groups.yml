---
# Declares every group in playbooks/vars/known_services.yml, so `groups['<svc>']`
# resolves to an empty list instead of being undefined when no host runs that
# service. Hosts are mapped into these groups by 99-constructed.yml.
all:
  children:
    consul_server: {}
    consul_agent: {}
    nomad_server: {}
    nomad_client: {}
    patroni: {}
    postgres: {}
    rabbitmq: {}
    haproxy: {}
    freeswitch: {}
    rtpengine: {}
    opensips: {}
    nginx: {}
    grafana: {}
    webitel_core: {}
    webitel_engine: {}
    webitel_call_center: {}
    webitel_flow_manager: {}
    webitel_storage: {}
    webitel_messages: {}
    webitel_logger: {}
    webitel_cases: {}
    webitel_media_exporter: {}
    webitel_frontend: {}
